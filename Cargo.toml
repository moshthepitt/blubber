[workspace]
resolver = "2"
members = [
    "crates/blubber-core",
    "crates/blubber",
    "crates/blubber-derive",
    "crates/blubber-model",
    "programs/blubber-demo",
    "programs/blubber-quickstart",
    "programs/borrow-resize",
    "programs/stack-matrix",
    "programs/cu-fixture",
    "programs/policy",
    "tests/mollusk",
    "tests/ide-consumer",
    "tests/doc-examples",
    "tests/fuzz-replay",
]
default-members = [
    "crates/blubber-core",
    "crates/blubber",
    "crates/blubber-derive",
    "crates/blubber-model",
    "tests/fuzz-replay",
]
exclude = [
    "benchmarks/compare",
    "benchmarks/d21-speed",
    "verification/kani",
    "fuzz",
    "crates/blubber-anchor",
    "programs/anchor-v2-raw",
    "programs/anchor-v2-load",
    "programs/anchor-v2-demo",
    "programs/anchor-v2-ergo",
]

[workspace.package]
repository = "https://github.com/moshthepitt/blubber"
license = "MIT"
version = "0.1.1"
edition = "2021"
rust-version = "1.89.0"

[workspace.dependencies]
blubber-core = { path = "crates/blubber-core", version = "0.1.1", default-features = false }
blubber = { path = "crates/blubber", version = "0.1.1", default-features = false }
blubber-derive = { path = "crates/blubber-derive", version = "0.1.1" }
blubber-model = { path = "crates/blubber-model" }
vstd = { version = "0.0.0-2026-10-18-0147", default-features = false }
pinocchio = { version = "0.12.0", default-features = false, features = ["account-resize", "copy", "cpi"] }
pinocchio-system = { version = "0.7.0", default-features = false }
solana-program-log = { version = "1.1.0", default-features = false }
solana-program-error = { version = "3.0.1", default-features = false }
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full", "visit", "visit-mut"] }
sha2 = "0.10.9"
mollusk-svm = "0.16.2"
mollusk-svm-bencher = "0.16.2"
solana-address = { version = "2.8.0", default-features = false }
solana-account = "4.5.0"
solana-instruction = "3.5.1"
solana-pubkey = "4.4.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)", "cfg(kani)", "cfg(docsrs)", "cfg(target_os, values(\"solana\"))", "cfg(target_feature, values(\"static-syscalls\"))"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
