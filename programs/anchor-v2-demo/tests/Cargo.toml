name = "blubber-anchor-v2-demo-tests"
version = "0.0.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[dev-dependencies]
anchor-lang-idl = { git = "https://github.com/solana-foundation/anchor", rev = "7d68eb325f297013a5e0903ddd698fe26218f5a3", features = ["build"] }
blubber-model = { path = "../../../crates/blubber-model" }
mollusk-svm = { version = "0.16.2", features = ["inner-instructions", "register-tracing"] }
serde_json = "1.0.154"
solana-account = "4.5.0"
solana-instruction = "3.5.1"
solana-pubkey = "4.4.0"

[[example]]
name = "idl"
