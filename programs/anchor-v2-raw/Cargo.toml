[package]
license = "MIT"
name = "blubber-anchor-v2-raw"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
resolver = "2"
members = ["tests"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "2.0.0-rc.2"
blubber = { path = "../../crates/blubber", default-features = false, features = ["derive", "pinocchio"] }
solana-address = { version = "2.8.0", default-features = false }
solana-instruction = { version = "3.5.1", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
