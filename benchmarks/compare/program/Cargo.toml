[package]
license = "MIT"
name = "compare-program"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
manifest = ["dep:hypertree", "dep:bytemuck"]
heap = []
no-entrypoint = []
baselines = ["dep:bytemuck", "dep:sokoban"]
zeropod = ["dep:zeropod"]
wincode = ["dep:wincode"]
pinapod = ["dep:pinapod"]
light = ["dep:light-zero-copy"]

[dependencies]
blubber = { path = "../../../crates/blubber", features = ["derive", "pinocchio", "alloc"] }
pinocchio = { version = "0.12.0", default-features = false, features = ["account-resize", "cpi", "alloc"] }
borsh = { version = "1.8.1", default-features = false, features = ["derive"] }

bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"], optional = true }
sokoban = { package = "lib-sokoban", git = "https://github.com/Ellipsis-Labs/sokoban", rev = "f8ecce2c50c12e6b8731b59ecdb3a1f43769a094", version = "0.3.3", optional = true }
zeropod = { git = "https://github.com/blueshift-gg/zeropod", rev = "8a607caf7861c932786e3f7d8759a7c066671b25", version = "0.4.0", optional = true }
wincode = { git = "https://github.com/anza-xyz/wincode", rev = "2d9cc7a2e974d726ced31ac1ad3c645113f685f0", version = "0.6.3", default-features = false, features = ["alloc", "derive"], optional = true }
pinapod = { git = "https://github.com/pina-rs/pinapod", rev = "c1b89cc19693f0952eb9990e23e48acbd992f2c7", version = "0.4.7", optional = true }
light-zero-copy = { version = "0.6.0", default-features = false, optional = true }

hypertree = { git = "https://github.com/CKS-Systems/manifest", rev = "5f4272ec067459dc6ed761331319678edcd25f51", version = "1.2.0", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
