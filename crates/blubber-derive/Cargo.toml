[package]
repository.workspace = true
license = "MIT"
name = "blubber-derive"
description = "Procedural macros #[blubber::schema] and #[derive(Fixed)], re-exported by blubber."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
include = ["/Cargo.toml", "/README.md", "/LICENSE", "/src/**/*.rs"]
keywords = ["solana", "serialization", "derive"]
categories = ["encoding", "development-tools::procedural-macro-helpers"]

[package.metadata.docs.rs]
features = []

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
proc-macro-crate.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
blubber = { path = "../blubber", default-features = false }

[lints]
workspace = true
