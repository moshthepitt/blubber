[package]
repository.workspace = true
license = "MIT"
name = "blubber"
description = "Growable lists, strings and maps inside a Solana account, edited in place."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
# The checkout build script generates differential test fixtures.
include = ["/Cargo.toml", "/README.md", "/LICENSE", "/src/**/*.rs", "!/src/**/tests.rs", "!/src/readers_kani.rs"]
keywords = ["solana", "serialization", "zero-copy"]
categories = ["no-std", "data-structures", "encoding"]

[package.metadata.docs.rs]
features = ["alloc", "derive", "pinocchio"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["derive"]
derive = ["dep:blubber-derive"]
alloc = []
verify-on-load = []
pinocchio = ["dep:pinocchio", "dep:pinocchio-system", "dep:solana-program-log", "solana-address/curve25519", "blubber-core/program-error"]
max-depth-16 = ["blubber-core/max-depth-16"]

[dependencies]
blubber-core.workspace = true
sha2-const-stable = "0.1.0"
solana-address = { workspace = true, features = ["copy"] }
solana-program-log = { workspace = true, optional = true }
blubber-derive = { workspace = true, optional = true }
pinocchio = { workspace = true, optional = true }
pinocchio-system = { workspace = true, optional = true }

[dev-dependencies]
sha2.workspace = true
bumpalo = "3.20.3"
serde_json = "1.0.154"
blubber-model.workspace = true
proptest = { version = "1.9.0", default-features = false, features = ["std"] }

[lints]
workspace = true
