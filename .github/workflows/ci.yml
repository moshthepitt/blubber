name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: bash scripts/reproduce.sh docs
      - run: time bash scripts/reproduce.sh install
      - run: bash scripts/reproduce.sh test
      - name: Check minimum Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --locked -p blubber-core -p blubber-derive -p blubber --all-features
      - name: Package library crates
        run: |
          cargo package --locked -p blubber-core
          cargo package --locked -p blubber-derive
      - run: python3 .github/check-links.py

  sbf-smoke:
    runs-on: ubuntu-latest
    env:
      AGAVE_VERSION: v4.0.0
      PLATFORM_TOOLS_VERSION: v1.53
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/blubber-agave
            ~/.cache/solana/v1.53
          key: sbf-${{ runner.os }}-${{ runner.arch }}-${{ env.AGAVE_VERSION }}-${{ env.PLATFORM_TOOLS_VERSION }}
      - name: Install pinned SBF tools
        run: |
          agave="$HOME/.local/share/blubber-agave"
          if [[ ! -x "$agave/solana-release/bin/cargo-build-sbf" ]]; then
            mkdir -p "$agave"
            archive="$RUNNER_TEMP/agave.tar.bz2"
            release="https://github.com/anza-xyz/agave/releases/download/$AGAVE_VERSION"
            curl --fail --location --silent --show-error \
              "$release/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o "$archive"
            echo "c839ba629d10edd5f99af68807dc25948fce62cd5176b56ad13e23f7562ef4f2  $archive" | sha256sum -c
            tar -xjf "$archive" -C "$agave"
          fi
          echo "$agave/solana-release/bin" >> "$GITHUB_PATH"
          "$agave/solana-release/bin/cargo-build-sbf" --tools-version "$PLATFORM_TOOLS_VERSION" --install-only
      - run: time bash scripts/reproduce.sh sbf smoke

  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      FUZZ_NIGHTLY: nightly-2025-12-08
      FUZZ_CLI_VERSION: 0.12.0
      CARGO_TARGET_DIR: ${{ github.workspace }}/fuzz/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ env.FUZZ_NIGHTLY }}-x86_64-unknown-linux-gnu
            ~/.local/share/blubber-fuzz-cli
          key: fuzz-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.FUZZ_NIGHTLY }}-${{ env.FUZZ_CLI_VERSION }}
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: ${{ env.FUZZ_NIGHTLY }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Install pinned fuzz CLI
        run: |
          fuzz_cli="$HOME/.local/share/blubber-fuzz-cli"
          if [[ ! -x "$fuzz_cli/bin/cargo-fuzz" ]]; then
            cargo +"$FUZZ_NIGHTLY" install --locked cargo-fuzz --version "$FUZZ_CLI_VERSION" --root "$fuzz_cli"
          fi
          echo "$fuzz_cli/bin" >> "$GITHUB_PATH"
      - run: time bash scripts/reproduce.sh fuzz validate smoke

  verus:
    runs-on: ubuntu-latest
    env:
      VERUS_VERSION: 0.2026.10.18.7d82994
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/verus
          key: verus-linux-x86-${{ env.VERUS_VERSION }}
      - name: Install pinned Verus
        run: |
          verus_dir="$HOME/.local/share/verus"
          if [[ ! -x "$verus_dir/verus-x86-linux/verus" ]]; then
            mkdir -p "$verus_dir"
            release="https://github.com/verus-lang/verus/releases/download/release/$VERUS_VERSION"
            curl --fail --location --silent --show-error \
              "$release/verus-$VERUS_VERSION-x86-linux.zip" -o "$RUNNER_TEMP/verus.zip"
            unzip -q "$RUNNER_TEMP/verus.zip" -d "$verus_dir"
          fi
          echo "$verus_dir/verus-x86-linux" >> "$GITHUB_PATH"
      - run: bash scripts/reproduce.sh verus
